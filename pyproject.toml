[project]
name = "pytorial"
version = "0.10.1"
description = "Interactive command-line tutorials with PTY-backed steps"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Daniel Bosk", email = "daniel@bosk.se"}
]
maintainers = [
  {name = "Daniel Bosk", email = "dbosk@kth.se"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Education",
  "Topic :: Education"
]
requires-python = ">=3.10"
dependencies = [
  "platformdirs>=4",
  "PyYAML>=6",
  "rich>=12.3.0",
  "typer>=0.9.0"
]

[project.scripts]
tutorial = "pytorial.cli:app"
pytorial = "pytorial.cli:app"

[project.urls]
repository = "https://github.com/dbosk/pytorial"
"Bug Tracker" = "https://github.com/dbosk/pytorial/issues"

[tool.poetry]
packages = [{include = "pytorial", from = "src"}]
# The .py and lesson .md files are generated from the .nw sources and
# git-ignored, so Poetry drops them unless they are included explicitly.
#
# Two Poetry behaviours shape these lists (tests/unit/test_packaging.py
# checks the result): an include beats an exclude, and an exclude cannot
# be limited to one format. Hence the lessons are listed by name, since a
# tutorials/*.md glob would also ship a stray CLAUDE.md past any exclude,
# and the .nw sources are excluded globally and re-included for the sdist
# alone.
include = [
  {path = "src/**/*.py", format = ["sdist", "wheel"]},
  {path = "src/pytorial/tutorials/shell-basics.md", format = ["sdist", "wheel"]},
  {path = "src/pytorial/tutorials/using-tutorials.md", format = ["sdist", "wheel"]},
  {path = "src/pytorial/tutorials/writing-tutorials.md", format = ["sdist", "wheel"]},
  {path = "src/**/*.nw", format = "sdist"},
  # What it takes to rebuild everything from the sdist with make: every
  # Makefile, the inputs of the documentation, and the tracked files of
  # the makefiles submodule. Poetry does not see a submodule's ignore
  # rules, and that directory collects build products, so a makefiles/**
  # glob would ship them; these patterns match tracked files only.
  {path = "Makefile", format = "sdist"},
  {path = "CONTRIBUTING.md", format = "sdist"},
  {path = "src/pytorial/Makefile", format = "sdist"},
  {path = "src/pytorial/tutorials/Makefile", format = "sdist"},
  {path = "tests/Makefile", format = "sdist"},
  {path = "doc/Makefile", format = "sdist"},
  {path = "doc/pytorial.nw", format = "sdist"},
  {path = "doc/abstract.tex", format = "sdist"},
  {path = "doc/preamble.tex", format = "sdist"},
  {path = "makefiles/*.mk", format = "sdist"},
  {path = "makefiles/*.nw", format = "sdist"},
  {path = "makefiles/*.bib", format = "sdist"},
  {path = "makefiles/Makefile", format = "sdist"},
  {path = "makefiles/Dockerfile", format = "sdist"},
  {path = "makefiles/LICENSE", format = "sdist"},
  {path = "makefiles/README.md", format = "sdist"},
  {path = "makefiles/CONTRIBUTING.md", format = "sdist"},
  {path = "makefiles/latexmkrc", format = "sdist"},
  {path = "makefiles/intro.tex", format = "sdist"},
  {path = "makefiles/makefiles.tex", format = "sdist"},
  {path = "makefiles/preamble.tex", format = "sdist"},
]
exclude = [
  "src/pytorial/.gitignore",
  "src/pytorial/Makefile",
  "src/pytorial/*.nw",
  "src/pytorial/*.tex",
  "src/pytorial/ltxobj",
  "src/pytorial/tutorials/Makefile",
  "src/pytorial/tutorials/*.nw",
  "src/pytorial/tutorials/*.tex",
  "src/pytorial/tutorials/ltxobj",
]

[tool.black]
target-version = ["py310"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pytest>=7.4"
]
